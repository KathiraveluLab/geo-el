# Geo-El Teacher Question & Answer Bank
# ======================================
# Teachers can add, edit, or remove geography questions directly in this YAML file.
#
# Optional top-level setting:
#   expedition_size: 6       # Number of random questions drawn per round (default: 6)
#
# Fields for each item under `questions:`:
#   - name:       Correct answer / place name shown to the student after guessing (Required)
#   - lat:        Target latitude in decimal degrees, from -90.0 to 90.0 (Required; negative = South)
#   - lon:        Target longitude in decimal degrees, from -180.0 to 180.0 (Required; negative = West)
#   - tier1_clue: Primary question prompt worth 1.0x points (Required)
#   - region:     Geographic region name (Optional; defaults to "Global Landmark")
#   - tier2_clue: Second hint unlocked at a 4% fuel cost, 0.85x multiplier (Optional; auto-generated from region if omitted)
#   - tier3_clue: Coordinate hint unlocked at a 4% fuel cost, 0.70x multiplier (Optional; auto-generated from lat/lon if omitted)
#   - id:         Unique short slug (Optional; auto-generated from name if omitted)
#
# Example entry to copy and customize:
#
#   - id: wp-grand-canyon
#     name: "Grand Canyon, Arizona"
#     region: "Colorado Plateau, North America"
#     lat: 36.1069
#     lon: -112.1129
#     tier1_clue: "Locate the steep-sided river gorge carved across a high arid plateau in southwestern North America."
#     tier2_clue: "Formed by the Colorado River in northern Arizona."
#     tier3_clue: "Target telemetry: latitude 36.1 degrees North, longitude 112.1 degrees West."

expedition_size: 6

questions:
